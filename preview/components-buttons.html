<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Buttons" subtitle="Primary / secondary / ghost / buy / sell / sizes" viewport="700x200" -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Components · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px; background: var(--tw-bg-canvas); font-family: var(--tw-font-sans); color: var(--tw-fg-3); }
  .grp { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; margin-bottom: 14px; }
  .grp:last-child { margin-bottom: 0; }
  .head { font: var(--tw-text-overline); letter-spacing: var(--tw-letter-overline); text-transform: uppercase; color: var(--tw-fg-4); margin: 0 0 10px; width: 100%; }
  .btn {
    font: 600 13px/1 var(--tw-font-sans);
    padding: 9px 16px; border-radius: 4px; border: 1px solid transparent;
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: background 80ms ease, border-color 80ms ease;
  }
  .btn-primary { background: var(--tw-navy-800); color: white; }
  .btn-primary:hover { background: var(--tw-navy-700); }
  .btn-secondary { background: white; color: var(--tw-fg-1); border-color: var(--tw-border); }
  .btn-secondary:hover { border-color: var(--tw-border-strong); background: var(--tw-ink-050); }
  .btn-ghost { background: transparent; color: var(--tw-fg-link); }
  .btn-ghost:hover { background: var(--tw-navy-050); }
  .btn-buy  { background: var(--tw-buy-600); color: white; }
  .btn-buy:hover  { background: var(--tw-buy-700); }
  .btn-sell { background: var(--tw-sell-600); color: white; }
  .btn-sell:hover { background: var(--tw-sell-700); }
  .btn-danger { background: white; color: var(--tw-sell-700); border-color: var(--tw-sell-100); }
  .btn[disabled] { background: var(--tw-ink-100); color: var(--tw-ink-300); border-color: transparent; cursor: not-allowed; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn-lg { padding: 12px 22px; font-size: 14px; }
</style>
</head>
<body>
  <div class="grp">
    <div class="head">Primary actions</div>
    <button class="btn btn-primary">送出委託</button>
    <button class="btn btn-primary btn-lg">確認下單</button>
    <button class="btn btn-secondary">取消</button>
    <button class="btn btn-ghost">查看詳情 →</button>
    <button class="btn btn-primary" disabled>送出中…</button>
  </div>
  <div class="grp">
    <div class="head">Trade actions</div>
    <button class="btn btn-buy btn-lg">買進 · BUY</button>
    <button class="btn btn-sell btn-lg">賣出 · SELL</button>
    <button class="btn btn-danger btn-sm">拒絕委託</button>
  </div>
  <div class="grp">
    <div class="head">Sizes</div>
    <button class="btn btn-primary btn-sm">SM</button>
    <button class="btn btn-primary">MD</button>
    <button class="btn btn-primary btn-lg">LG</button>
  </div>
</body>
</html>
