<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Gold accent" subtitle="From logo wheat — sparing accent only" viewport="700x180" -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Colors · Gold accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--tw-bg-canvas); font-family: var(--tw-font-sans); }
  .row { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr 1fr 1fr; gap: 0; padding: 16px; }
  .sw {
    height: 110px; padding: 12px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: var(--tw-ink-900);
  }
  .sw.dark { color: var(--tw-gold-100); }
  .sw .name { font: 600 11px/1.2 var(--tw-font-sans); letter-spacing: 0.04em; text-transform: uppercase; }
  .sw .hex  { font: 500 11px/1.2 var(--tw-font-mono); opacity: 0.9; }
  .usage { padding: 0 16px 16px; font: var(--tw-text-small); color: var(--tw-fg-3); }
</style>
</head>
<body>
<div class="row">
  <div class="sw dark" style="background:#6B3A1E"><div class="name">Clay 700</div><div class="hex">#6B3A1E</div></div>
  <div class="sw dark" style="background:#8C6210"><div class="name">Gold 700</div><div class="hex">#8C6210</div></div>
  <div class="sw dark" style="background:#B4831C"><div class="name">Gold 600 ★</div><div class="hex">#B4831C</div></div>
  <div class="sw" style="background:#D2A23A"><div class="name">Gold 500</div><div class="hex">#D2A23A</div></div>
  <div class="sw" style="background:#E5BE63"><div class="name">Gold 400</div><div class="hex">#E5BE63</div></div>
  <div class="sw" style="background:#FBF6E8"><div class="name">Gold 050</div><div class="hex">#FBF6E8</div></div>
</div>
<div class="usage">★ Gold 600 is the logo color. Used sparingly — brand chip, premium-tier badge, key delineators. <strong>Never as a primary CTA.</strong></div>
</body>
</html>
