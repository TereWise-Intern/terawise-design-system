<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Display type" subtitle="Source Serif 4 · brand voice for marketing surfaces" viewport="700x260" -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Type · Display serif</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px 28px; background: var(--tw-bg-canvas); }
  .row {
    display: grid; grid-template-columns: 110px 1fr; gap: 24px;
    align-items: baseline; padding: 10px 0;
    border-bottom: 1px solid var(--tw-border-subtle);
  }
  .row:last-child { border-bottom: 0; }
  .meta {
    font: 500 11px/1.4 var(--tw-font-mono); color: var(--tw-fg-4);
    letter-spacing: 0.02em;
  }
  .specimen { color: var(--tw-fg-1); font-family: var(--tw-font-serif); }
  .d1 { font: var(--tw-text-display-1); letter-spacing: -0.01em; }
  .d2 { font: var(--tw-text-display-2); letter-spacing: -0.01em; }
  .d3 { font: var(--tw-text-display-3); }
</style>
</head>
<body>
  <div class="row"><div class="meta">Display 1<br>56 / 1.1 / 700</div><div class="specimen d1">兆易觀點</div></div>
  <div class="row"><div class="meta">Display 2<br>40 / 1.15 / 600</div><div class="specimen d2">Your Most Reliable Partner</div></div>
  <div class="row"><div class="meta">Display 3<br>32 / 1.2 / 600</div><div class="specimen d3">Global Weekly Report</div></div>
</body>
</html>
