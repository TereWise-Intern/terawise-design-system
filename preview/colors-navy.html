<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Navy core palette" subtitle="Brand navy 100→900 — surfaces, headers, terminal" viewport="700x130" -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Colors · Navy core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--tw-bg-canvas); font-family: var(--tw-font-sans); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; padding: 16px; }
  .sw {
    aspect-ratio: 1 / 1.15; padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: white;
  }
  .sw.light { color: var(--tw-ink-800); }
  .sw .name { font: 600 11px/1.2 var(--tw-font-sans); letter-spacing: 0.04em; text-transform: uppercase; }
  .sw .hex  { font: 500 11px/1.2 var(--tw-font-mono); opacity: 0.85; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw" style="background:#0A1A2F"><div class="name">Navy 900</div><div class="hex">#0A1A2F</div></div>
  <div class="sw" style="background:#0F2540"><div class="name">Navy 800</div><div class="hex">#0F2540</div></div>
  <div class="sw" style="background:#16314F"><div class="name">Navy 700</div><div class="hex">#16314F</div></div>
  <div class="sw" style="background:#1E3F62"><div class="name">Navy 600</div><div class="hex">#1E3F62</div></div>
  <div class="sw" style="background:#2C5582"><div class="name">Navy 500</div><div class="hex">#2C5582</div></div>
  <div class="sw" style="background:#4577A8"><div class="name">Navy 400</div><div class="hex">#4577A8</div></div>
  <div class="sw light" style="background:#C2D2E3"><div class="name">Navy 200</div><div class="hex">#C2D2E3</div></div>
  <div class="sw light" style="background:#E4ECF4"><div class="name">Navy 100</div><div class="hex">#E4ECF4</div></div>
</div>
</body>
</html>
