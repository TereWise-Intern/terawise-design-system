<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Order ticket card" subtitle="Confirmation card pattern — key/value rows + footer actions" viewport="700x360" -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Components · Card / order ticket</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px; background: var(--tw-bg-page); font-family: var(--tw-font-sans); color: var(--tw-fg-2); }
  .card {
    background: white; border: 1px solid var(--tw-border);
    border-radius: 6px; box-shadow: var(--tw-shadow-1);
    padding: 18px 20px; max-width: 560px;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 12px; border-bottom: 1px solid var(--tw-border-subtle); margin-bottom: 14px;
  }
  .title { font: 600 15px/1.3 var(--tw-font-sans); color: var(--tw-fg-1); }
  .subtitle { font: 500 11px/1 var(--tw-font-mono); color: var(--tw-fg-4); letter-spacing: 0.04em; }
  .rows { display: grid; grid-template-columns: 110px 1fr; gap: 8px 18px; font-variant-numeric: tabular-nums; }
  .k { font: 400 12px/1.6 var(--tw-font-sans); color: var(--tw-fg-3); }
  .v { font: 500 13px/1.6 var(--tw-font-mono); color: var(--tw-fg-1); }
  .v .b { display: inline-flex; font: 600 10px/1 var(--tw-font-sans); padding: 3px 6px; border-radius: 2px; background: var(--tw-buy-100); color: var(--tw-buy-700); margin-right: 6px; }
  .foot { display: flex; gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--tw-border-subtle); justify-content: flex-end; }
  .btn { font: 600 13px/1 var(--tw-font-sans); padding: 9px 16px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; }
  .btn-primary { background: var(--tw-navy-800); color: white; }
  .btn-sec { background: white; color: var(--tw-fg-2); border-color: var(--tw-border); }
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="title">委託確認 Order Ticket</div>
    <div class="subtitle">OR-20250218-0142</div>
  </div>
  <div class="rows">
    <div class="k">市場</div><div class="v">US 美股 · NASDAQ</div>
    <div class="k">股票</div><div class="v">AAPL — Apple Inc.</div>
    <div class="k">方向</div><div class="v"><span class="b">BUY</span> 買進</div>
    <div class="k">數量</div><div class="v">100 股</div>
    <div class="k">委託類型</div><div class="v">限價 LIMIT</div>
    <div class="k">限價</div><div class="v">US$ 227.50</div>
    <div class="k">預估金額</div><div class="v">US$ 22,750.00</div>
  </div>
  <div class="foot">
    <button class="btn btn-sec">返回修改</button>
    <button class="btn btn-primary">確認送出</button>
  </div>
</div>
</body>
</html>
